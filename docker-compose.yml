networks:
  jaeger-net:
    external: true
    name: jaeger-net

services:
  jaeger:
    image: jaegertracing/jaeger:${JAEGER_VERSION:?Run via make}
    restart: unless-stopped
    command: ["--config=/etc/jaeger/config.yaml"]
    ports:
      - "127.0.0.1:16686:16686"
    volumes:
      - ./jaeger.yaml:/etc/jaeger/config.yaml:ro
    networks:
      - jaeger-net
    extends:
      file: docker-compose.base.yml
      service: base
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1.0g

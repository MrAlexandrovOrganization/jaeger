networks:
  jaeger-net:
    external: true
    name: jaeger-net

services:
  jaeger:
    container_name: "${CONTAINER_NAME_PREFIX:-}jaeger"
    image: ${JAEGER_IMAGE:?Run via make}
    restart: unless-stopped
    command: ["--config=/etc/jaeger/config.yaml"]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./jaeger.yaml:/etc/jaeger/config.yaml:ro
    networks:
      - jaeger-net
    extends:
      file: compose/docker-compose.base.yml
      service: base
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1.0g
